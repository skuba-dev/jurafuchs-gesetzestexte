<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Normfenster – Gesetzestexte verstehen</title>
  <style>
/* ===== tokens.css ===== */
/* Jurafuchs Design System – Tokens (1:1 aus DESIGN.md, Abschnitt 3.1). Quelle der Wahrheit: keine losen Hex-Werte außerhalb dieser Datei. */
:root {
  /* ---------- Schriften ---------- */
  --font-sans: "GT Walsheim Pro", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Fragment Mono", ui-monospace, Menlo, monospace;

  /* ---------- Flächen ---------- */
  --surface-peach: #fef7f1;   /* Seiten- und Hero-Grund */
  --surface: #ffffff;         /* Header, Karten, Inputs, sekundäre Buttons */
  --surface-warm: #f8f5f3;    /* ruhige Panels, Tabellenstreifen (einziges neutrales Panel) */

  /* ---------- Text / Tinte ---------- */
  --ink: #1f1f1f;             /* Überschriften, Kartentitel */
  --charcoal: #2e2e2e;        /* Standard-Fließtext, Primary-Button-Fläche */
  --on-charcoal: #ffffff;     /* Text auf Charcoal */
  --ink-muted: #595959;       /* Lead, Navigation, Sekundärtext (6,6:1 auf Peach) */
  --ink-subtle: #7e7e7e;      /* NUR Platzhalter/Deko, nie Fließtext (4,06:1 auf Weiß) */

  /* ---------- Linien ---------- */
  --border: #ebebeb;          /* Header-Unterkante, Kartentrenner */
  --border-strong: #d9d9d9;   /* Outline sekundärer Button, Input-Rahmen */

  /* ---------- Marke / Akzente ---------- */
  --coral: #ef7355;           /* Markenfarbe: Blob, Script-Wortmarke, Flächen. NICHT für kleinen Text */
  --coral-hover: #cc5537;     /* Hover/Pressed koralle Links (nur großer Text, 4,0:1) */
  --coral-text: #c2492b;      /* Koralle für Text: 4,6:1 auf Peach, 4,9:1 auf Weiß */
  --sun: #f5a453;             /* Warmer Zweitakzent, nur Flächen/Illustration */
  --rose: #e94757;            /* Danger/negativ, nur Flächen/Icons, immer mit Wort */
  --teal: #01cba8;            /* Illustration/Highlights, nur Flächen */
  --green: #00c866;           /* Erfolgsmarker (Haken), nur Fläche/Icon */
  --sky: #06b5ed;            /* Illustration, nur Flächen */
  --blue: #1e88ce;            /* Illustration, nur Flächen */
  --navy: #102a43;            /* tiefstes Blau, dunkle Illustrationsgründe */
  --star: #ffcc02;            /* Bewertungsstern, nur Fläche */

  /* ---------- Feedback-Töne ---------- */
  --info-bg: #f2f8fd;         /* Fachhinweis (Peer/Rubrik) */
  --info-border: #c3effd;
  --info-ink: #12537e;        /* 7,6:1 auf info-bg */
  --foxxy-bg: #fef7f1;        /* KI-Feedback (= surface-peach) */
  --foxxy-border: #fce1c5;
  --foxxy-ink: #e84a24;       /* NUR Illustration (3,6:1). Für Text coral-text verwenden */
  --success-bg: #ebfff5;      /* Punkte-Pill */
  --success-ink: #00793c;     /* 5,3:1 auf success-bg */
  --peer-bg: #fcf5fe;         /* Avatar-Scheibe der Peer-Person */
  --peer-ink: #6b0995;        /* Initialen im Avatar */

  /* ---------- Abstände (4px-Raster) ---------- */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;

  /* ---------- Radien ---------- */
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 10px;
  --radius-xl: 20px;
  --radius-pill: 999px;

  /* ---------- Schatten ---------- */
  --shadow-sm: 0 4px 4px 0 rgba(0, 0, 0, 0.05);
  --shadow-card: 0 8px 24px 0 rgba(120, 80, 50, 0.12);
}

/* ===== components.css ===== */
/* Jurafuchs Design System – Basis-Komponenten (1:1 aus DESIGN.md, Abschnitt 6.1).
   In Normfenster genutzt: Button (jf-btn), FeedbackNote (jf-note), visually-hidden.
   PointsPill und ExamCard sind nicht im Einsatz: Punkte gibt es hier nicht, und die Kartenliste ist flach (kein schwebender Schatten). */

/* ---------- Button ---------- */
.jf-btn {
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
  border-radius: var(--radius-lg);
  padding: 14px 20px;
  border: 1px solid transparent;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
}
.jf-btn--lg { font-size: 15px; padding: 17px 20px; }
.jf-btn--primary { background: var(--charcoal); color: var(--on-charcoal); }
.jf-btn--primary:hover { background: var(--ink); }
.jf-btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--border-strong); }
.jf-btn--secondary:hover { border-color: var(--ink-muted); text-decoration: none; }
.jf-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.jf-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------- FeedbackNote ---------- */
.jf-note {
  font-family: var(--font-sans);
  border: 1px solid;
  border-radius: var(--radius-md);
  padding: 12px;
  box-sizing: border-box;
}
.jf-note--info  { background: var(--info-bg);  border-color: var(--info-border); }
.jf-note--foxxy { background: var(--foxxy-bg); border-color: var(--foxxy-border); }
.jf-note__label { font-size: 13px; line-height: 18px; font-weight: 700; margin-bottom: 4px; }
.jf-note--info  .jf-note__label { color: var(--info-ink); }
.jf-note--foxxy .jf-note__label { color: var(--coral-text); }
.jf-note__body  { font-size: 12px; line-height: 20px; font-weight: 400; color: var(--ink); }

.jf-visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

/* ===== styles.css ===== */
/* Normfenster – App-Styles auf Basis des Jurafuchs Design Systems (siehe DESIGN.md).
   Alle Farben, Abstände, Radien, Schatten und Schriften kommen aus tokens.css.
   Layout-Maße (Header-/Seitenleistenbreite) sind keine Design-Tokens und stehen hier als lokale Variablen. */
:root {
  --top-h: 64px;
  --crumb-h: 48px;
  --lw: 280px;
  --rw: 296px;
  --law-size: 16px;
}

/* ============================================================ Basis (DESIGN.md, Abschnitt 5) */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--surface-peach); height: 100%; }
body {
  margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden;
  font-family: var(--font-sans); font-size: 16px; line-height: 25px; color: var(--charcoal);
  background: var(--surface-peach); -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3, h4 { color: var(--ink); font-weight: 700; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--coral-text); text-decoration: none; }
/* Hover: Unterstreichung statt coral-hover – coral-hover erreicht für kleinen Text nur 4,0:1 (DESIGN.md, Abschnitt 7) */
a:hover { text-decoration: underline; }
svg { flex: none; }

/* Fokus: gilt für jedes interaktive Element */
:where(a, button, input, select, textarea, [tabindex]):focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Eingabefelder */
input, textarea, select {
  font: inherit; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 12px 14px;
}
input::placeholder, textarea::placeholder { color: var(--ink-subtle); }
input[type="range"] { padding: 0; border: 0; background: none; accent-color: var(--charcoal); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-pill); border: 2px solid transparent; background-clip: content-box; }

.skip { position: absolute; left: var(--space-4); top: -100px; z-index: 200; background: var(--charcoal); color: var(--on-charcoal); padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); }
.skip:focus { top: var(--space-2); text-decoration: none; }

/* Typografie-Hilfsklassen (DESIGN.md, Abschnitt 3.3) */
.t-eyebrow { font: 500 13px/18px var(--font-sans); color: var(--coral-text); }
.t-caption { font: 400 11px/16px var(--font-sans); color: var(--ink-muted); }
.linkbtn { color: var(--coral-text); font: 500 14px/20px var(--font-sans); padding: var(--space-1) 0; border-radius: var(--radius-sm); }
.linkbtn:hover { text-decoration: underline; }

/* ============================================================ Header */
.topbar {
  height: var(--top-h); flex: none; display: flex; align-items: center; gap: var(--space-6);
  padding: 0 var(--space-6); background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: var(--space-2); font: 700 20px/26px var(--font-sans); color: var(--ink); white-space: nowrap; }
.law-pill { font: 500 12px/16px var(--font-sans); padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-warm); color: var(--ink); }
.search {
  position: relative; flex: 1; max-width: 560px; height: 44px; display: flex; align-items: center; gap: var(--space-2);
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); padding: 0 var(--space-3); color: var(--ink-muted);
}
.search:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.search label { font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; background: none; padding: 0; color: var(--ink); outline: none; }
.search input:focus-visible { outline: none; }
kbd { font: 400 11px/16px var(--font-mono); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); padding: 0 6px; color: var(--ink-muted); background: var(--surface); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
.seg { display: flex; align-items: center; gap: 2px; background: var(--surface-warm); border-radius: var(--radius-lg); padding: var(--space-1); }
.seg-label { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); padding: 0 var(--space-2); }
.seg button { display: flex; align-items: center; gap: var(--space-2); min-height: 36px; padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--ink-muted); font: 500 14px/20px var(--font-sans); }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--charcoal); color: var(--on-charcoal); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: var(--radius-lg); color: var(--ink-muted); }
.icon-btn:hover, .icon-btn.on { background: var(--surface-warm); color: var(--ink); }

.results { position: absolute; top: 52px; left: 0; right: 0; z-index: 40; max-height: 420px; overflow: auto; padding: var(--space-2);
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.results .res { display: flex; flex-direction: column; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer; color: var(--ink); font: 400 14px/20px var(--font-sans); }
.results .res.sel, .results .res:hover { background: var(--surface-warm); }
.res b { font-weight: 700; }
.res small { color: var(--ink-muted); font-size: 12px; line-height: 20px; }
.res mark { background: var(--foxxy-border); color: inherit; border-radius: 2px; padding: 0 1px; }
.results .empty { padding: var(--space-3); color: var(--ink-muted); font-size: 14px; }

/* ============================================================ Einordnung */
.crumbs { height: var(--crumb-h); flex: none; display: flex; align-items: center; gap: 2px; padding: 0 var(--space-6); overflow-x: auto; white-space: nowrap;
  background: var(--surface); border-bottom: 1px solid var(--border); scrollbar-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { display: inline-flex; align-items: baseline; gap: var(--space-2); padding: var(--space-1) var(--space-2); border-radius: var(--radius-md); font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
button.crumb:hover { background: var(--surface-warm); color: var(--ink); }
.crumb .rng { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.crumb .lvl { font: 400 11px/16px var(--font-sans); color: var(--ink-muted); }
.crumb.cur { background: var(--surface-peach); color: var(--ink); font-weight: 700; }
.crumb-sep { color: var(--ink-subtle); }

/* ============================================================ Arbeitsfläche */
.scroller { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scroll-behavior: smooth; }
.stage {
  height: calc(100vh - var(--top-h) - var(--crumb-h)); min-height: 520px;
  display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); gap: var(--space-4); padding: var(--space-4) var(--space-6);
}
.stage.no-left { grid-template-columns: minmax(0, 1fr) var(--rw); }
.stage.no-right { grid-template-columns: var(--lw) minmax(0, 1fr); }
.stage.no-left.no-right { grid-template-columns: minmax(0, 1fr); }
.stage.no-left .left, .stage.no-right .right { display: none; }

.side { display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.side-head { padding: var(--space-4) var(--space-4) var(--space-3); border-bottom: 1px solid var(--border); }
.side-head .eyebrow { font: 500 13px/18px var(--font-sans); color: var(--coral-text); }
.side-head h3 { font: 700 14px/20px var(--font-sans); margin-top: 2px; }
.side-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-2); }
.side-foot { display: flex; justify-content: space-between; align-items: center; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.link-btn { color: var(--coral-text); font: 500 12px/16px var(--font-sans); }
.link-btn:hover { text-decoration: underline; }

.tabs { display: flex; gap: var(--space-1); padding: var(--space-2); border-bottom: 1px solid var(--border); }
.tabs button { flex: 1; min-height: 40px; border-radius: var(--radius-md); font: 500 14px/20px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.tabs button:hover { background: var(--surface-warm); color: var(--ink); }
.tabs button.on { background: var(--charcoal); color: var(--on-charcoal); }
.tabs i { font: 500 11px/16px var(--font-sans); font-style: normal; background: var(--surface-warm); color: var(--ink); border-radius: var(--radius-pill); padding: 0 6px; margin-left: var(--space-1); }
.tabs button.on i { background: var(--ink-muted); color: var(--on-charcoal); }

.group-label { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); padding: var(--space-3) var(--space-2) var(--space-1); }
.nrow { position: relative; display: grid; grid-template-columns: 58px 1fr auto; align-items: baseline; gap: var(--space-2); padding: 10px var(--space-3); border-radius: var(--radius-md); cursor: pointer; color: var(--charcoal); text-decoration: none; }
.nrow:hover { background: var(--surface-warm); text-decoration: none; }
.nrow .n { font: 700 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nrow .t { font: 400 14px/20px var(--font-sans); color: var(--charcoal); }
.nrow .m { display: inline-flex; align-items: center; gap: var(--space-1); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); white-space: nowrap; }
.nrow.cur { background: var(--surface-peach); box-shadow: inset 3px 0 0 var(--coral); }
.nrow.open:not(.cur) { box-shadow: inset 3px 0 0 var(--border-strong); }
.nrow.gone .n, .nrow.gone .t { color: var(--ink-muted); }
.nrow.gone .t { font-style: italic; }
.nrow .sub { grid-column: 2 / 4; font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.star { display: inline-flex; vertical-align: middle; margin-left: var(--space-1); }
.badge-now, .badge-last { font: 500 11px/16px var(--font-sans); padding: 0 6px; border-radius: var(--radius-pill); margin-left: var(--space-1); white-space: nowrap; }
.badge-now { background: var(--success-bg); color: var(--success-ink); }
.badge-last { background: var(--surface-peach); color: var(--coral-text); border: 1px solid var(--foxxy-border); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.pips { font-size: 6px; letter-spacing: 1px; color: var(--coral); margin-right: var(--space-1); white-space: nowrap; line-height: 1; }
.pips i { font-style: normal; color: var(--border-strong); }
.empty-note { padding: var(--space-5) var(--space-3); color: var(--ink-muted); text-align: center; font: 400 14px/22px var(--font-sans); }

.sec-nav { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; padding: var(--space-3) var(--space-4); background: var(--surface); color: var(--ink-muted); }
.sec-nav.prev { border-bottom: 1px solid var(--border); }
.sec-nav.next { border-top: 1px solid var(--border); }
.sec-nav:hover:not(:disabled) { background: var(--surface-warm); }
.sec-nav:disabled { cursor: not-allowed; }
.sec-nav .sn-l { font: 500 13px/18px var(--font-sans); color: var(--coral-text); }
.sec-nav:disabled .sn-l { color: var(--ink-muted); }
.sec-nav .sn-t { font: 500 14px/20px var(--font-sans); color: var(--ink); }
.sec-nav:disabled .sn-t { color: var(--ink-muted); }
.sec-nav .sn-r { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }

/* Lernstand */
.card-s { background: var(--surface-warm); border-radius: var(--radius-md); padding: var(--space-3); margin: var(--space-2) var(--space-1) var(--space-3); }
.card-s h4 { font: 700 13px/18px var(--font-sans); margin-bottom: var(--space-2); }
.bar { height: 8px; border-radius: var(--radius-pill); background: var(--border); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--coral); border-radius: var(--radius-pill); }
.bar.good > i { background: var(--green); }
.topic-row { margin-bottom: var(--space-3); }
.topic-row .l { display: flex; justify-content: space-between; font: 400 12px/16px var(--font-sans); margin-bottom: var(--space-1); color: var(--ink-muted); }
.rec { padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); margin-bottom: var(--space-2); cursor: pointer; }
.rec:hover { border-color: var(--ink-muted); }
.rec .h { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); font: 700 13px/18px var(--font-sans); color: var(--ink); }
.rec .why { font: 400 12px/20px var(--font-sans); color: var(--ink-muted); margin-top: var(--space-1); }
.pri { font: 500 11px/16px var(--font-sans); padding: 0 var(--space-2); border-radius: var(--radius-sm); background: var(--foxxy-bg); color: var(--coral-text); border: 1px solid var(--foxxy-border); white-space: nowrap; }
.fine { font: 400 11px/16px var(--font-sans); color: var(--ink-muted); padding: var(--space-1) var(--space-2) var(--space-3); }

/* ============================================================ Normfenster (Mitte) */
.center { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: var(--space-3); }
.panes { flex: 1; min-height: 0; display: flex; gap: var(--space-3); overflow-x: auto; overflow-y: hidden; }
.pane { position: relative; flex: 1 1 0; min-width: 360px; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.panes[data-count="1"] .pane { min-width: 0; }
.pane.focused { border-color: var(--ink-muted); box-shadow: var(--shadow-sm); }
.pane-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) var(--space-3) var(--space-6); border-bottom: 1px solid var(--border); }
.pane-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: var(--space-3); }
.pane-par { font: 700 20px/26px var(--font-sans); color: var(--coral-text); white-space: nowrap; }
.pane-title { flex-wrap: wrap; row-gap: 0; }
.pane-title h2 { font: 700 20px/26px var(--font-sans); min-width: 0; overflow-wrap: break-word; }
.pane-actions { display: flex; gap: 2px; }
.pane-actions button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-md); color: var(--ink-muted); }
.pane-actions button:hover, .pane-actions button.on { background: var(--surface-warm); color: var(--ink); }
.pane-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--space-6) var(--space-6) var(--space-8); font-family: var(--font-sans); font-size: var(--law-size); line-height: 1.65; color: var(--charcoal); scroll-behavior: smooth; }

/* „Kurz erklärt“ = FeedbackNote (info). Längerer Lesetext: 14/22 statt 12/20. */
.explain { margin-bottom: var(--space-6); padding: var(--space-3); }
.explain summary { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); cursor: pointer; list-style: none; margin: 0; border-radius: var(--radius-sm); }
.explain summary::-webkit-details-marker { display: none; }
.explain summary::after { content: "▾"; color: var(--info-ink); }
.explain:not([open]) summary::after { content: "▸"; }
.explain .jf-note__body { font-size: 14px; line-height: 22px; margin-top: var(--space-1); }

.blk { margin: 0 0 .55em; }
.blk.abs { display: grid; grid-template-columns: 2.7em 1fr; column-gap: .2em; }
.abs-n { font: 700 13px/18px var(--font-sans); color: var(--ink-muted); text-align: left; padding: 3px 2px; margin-top: .15em; cursor: copy; border-radius: var(--radius-sm); align-self: start; }
.abs-n:hover { background: var(--surface-warm); color: var(--ink); }
.blk.nr { display: grid; grid-template-columns: 1.8em 1fr; margin-left: 2.9em; margin-bottom: .3em; }
.blk.nr .nn { font: 500 .85em/1.9 var(--font-sans); color: var(--ink-muted); }
.blk.grp { margin-left: 2.9em; padding-left: var(--space-3); border-left: 3px solid var(--border-strong); margin-bottom: .3em; }
.blk.txt.cont { margin-left: 2.9em; }
.flash { animation: flash 2.2s ease-out; border-radius: var(--radius-sm); }
@keyframes flash { 0%, 35% { background: var(--foxxy-border); box-shadow: 0 0 0 6px var(--foxxy-border); } 100% { background: transparent; box-shadow: 0 0 0 6px transparent; } }
.gone-note { font: italic 400 14px/22px var(--font-sans); color: var(--ink-muted); padding: var(--space-2) 0; }
.foot { margin-top: var(--space-6); border-top: 1px dashed var(--border-strong); font: 400 12px/20px var(--font-sans); color: var(--ink-muted); }
.foot summary { cursor: pointer; padding: var(--space-3) 0; font-weight: 500; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.foot p { margin-bottom: var(--space-2); }

/* Verweise und Begriffe */
a.xref { color: var(--coral-text); font-weight: 500; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; border-radius: 2px; }
a.xref:hover { background: var(--surface-peach); }
a.xref.ext { text-decoration-style: dashed; }
a.xref.ext::after { content: "↗"; font-size: .75em; margin-left: 2px; }
.term { border-bottom: 2px dotted var(--info-ink); background: var(--info-bg); cursor: help; border-radius: var(--radius-sm); }
.term:hover, .term:focus { background: var(--info-border); }
.term.own { border-bottom-color: var(--coral-text); background: var(--foxxy-bg); }
.term.own:hover, .term.own:focus { background: var(--foxxy-border); }
.nodefs .term { border: 0; background: none; cursor: inherit; }

/* ============================================================ Tags, Hinweisleiste */
.tagbar { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; min-height: 56px; max-height: 104px; overflow-y: auto;
  padding: var(--space-3) var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); }
.tagbar .lbl { font: 500 13px/18px var(--font-sans); color: var(--ink-muted); margin-right: var(--space-1); white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 32px; padding: var(--space-1) var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-pill);
  background: var(--surface); color: var(--ink); text-decoration: none; cursor: pointer; font: 500 14px/20px var(--font-sans); }
.chip b { font-weight: 700; color: var(--ink); }
.chip small { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.chip:hover { border-color: var(--ink-muted); text-decoration: none; }
.chip.ext { border-style: dashed; }
.chip.own { border-color: var(--coral); }
.chip.openp { background: var(--surface-peach); border-color: var(--foxxy-border); }
.chip .x { color: var(--ink-muted); line-height: 1; }
.chip .x:hover { color: var(--ink); }
.chip-add { border-style: dashed; color: var(--ink-muted); background: transparent; }
.hintbar { display: flex; justify-content: center; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3); border-radius: var(--radius-lg); font: 500 14px/20px var(--font-sans); color: var(--ink-muted); }
.hintbar:hover { background: var(--surface); color: var(--ink); }

/* ============================================================ Zusatzinformationen */
.extra { padding: 0 var(--space-6) var(--space-16); min-height: calc(100vh - var(--top-h) - var(--crumb-h)); }
.extra-inner { max-width: 1100px; margin: 0 auto; }
.extra-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) 0; background: linear-gradient(var(--surface-peach) 85%, transparent); }
.back { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border-strong); color: var(--ink); font: 500 14px/20px var(--font-sans); }
.back:hover { border-color: var(--ink-muted); }
.extra-title { display: flex; flex-direction: column; min-width: 0; }
.extra-title h2 { font: 700 20px/26px var(--font-sans); }
.extra-bar .flt { margin-left: auto; display: flex; gap: var(--space-1); flex-wrap: wrap; }
.flt button { min-height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-muted); font: 500 14px/20px var(--font-sans); }
.flt button:hover { border-color: var(--ink-muted); color: var(--ink); }
.flt button.on { background: var(--charcoal); border-color: var(--charcoal); color: var(--on-charcoal); }
.extra-note { margin-bottom: var(--space-4); }
.extra-note .jf-note__body { font-size: 14px; line-height: 22px; }
.extra-grid { display: grid; grid-template-columns: 1fr 1fr 340px; gap: var(--space-4); align-items: start; }
.extra-grid.only-rspr, .extra-grid.only-lit { grid-template-columns: 1fr 340px; }
.col h3 { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); font: 700 14px/20px var(--font-sans); margin: 0 0 var(--space-3); }
.xcard { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5); margin-bottom: var(--space-4); }
.xcard .top { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
.xcard h4 { font: 700 14px/20px var(--font-sans); margin-bottom: var(--space-1); }
.xcard p { font: 400 14px/22px var(--font-sans); color: var(--ink-muted); }
.xcard .cite { margin-top: var(--space-2); font: 400 12px/16px var(--font-sans); color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.xcard .authors { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); margin-bottom: var(--space-2); }
.xcard .art-link { display: inline-block; margin-top: var(--space-3); font: 500 14px/20px var(--font-sans); }
.recs { padding: 0 var(--space-1); }
.xcard .del { position: absolute; top: var(--space-2); right: var(--space-2); width: 32px; height: 32px; border-radius: var(--radius-md); color: var(--ink-muted); }
.xcard .del:hover { background: var(--surface-warm); color: var(--ink); }
.tag { font: 500 11px/16px var(--font-sans); padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-warm); color: var(--ink); }
.tag.lit, .tag.zjs { background: var(--info-bg); color: var(--info-ink); }
.tag.eg { border: 1px solid var(--border-strong); }
.tag.mine { background: var(--foxxy-bg); color: var(--coral-text); }
.tag.new { background: var(--success-bg); color: var(--success-ink); }
.tag.date { background: none; color: var(--ink-muted); padding: 0; font-weight: 400; }
.notes { width: 100%; min-height: 220px; resize: vertical; line-height: 22px; border-radius: var(--radius-xl); padding: var(--space-4) var(--space-5); }
.litflt { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0 0 var(--space-4); }
.litflt .lf { min-height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink-muted); font: 500 13px/18px var(--font-sans); }
.litflt .lf i { font-style: normal; font-weight: 400; margin-left: var(--space-1); }
.litflt .lf:hover { border-color: var(--ink-muted); color: var(--ink); }
.litflt .lf.on { background: var(--surface-peach); border-color: var(--ink); color: var(--ink); font-weight: 700; }
.litflt .lf.on::before { content: "✓ "; }

/* ============================================================ Popover, Einstellungen, Dialog, Toast */
.pop { position: fixed; z-index: 100; width: 360px; max-width: calc(100vw - 24px); background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); padding: var(--space-4); font: 400 14px/22px var(--font-sans); color: var(--charcoal); }
.pop .ph { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
.pop .ph strong { font: 700 14px/20px var(--font-sans); color: var(--ink); }
.pop .kind { font: 500 11px/16px var(--font-sans); padding: 2px var(--space-2); border-radius: var(--radius-sm); background: var(--info-bg); color: var(--info-ink); white-space: nowrap; }
.pop .kind.leg { background: var(--success-bg); color: var(--success-ink); }
.pop .subdef { margin-top: var(--space-2); padding: var(--space-1) var(--space-3); border-left: 3px solid var(--border-strong); font-size: 13px; line-height: 20px; color: var(--ink-muted); }
.pop .subdef b { color: var(--ink); }
.pop .mine { margin-top: var(--space-3); padding: var(--space-3); border-radius: var(--radius-md); background: var(--foxxy-bg); border: 1px solid var(--foxxy-border); }
.pop .mine .mh { font: 700 13px/18px var(--font-sans); color: var(--coral-text); margin-bottom: var(--space-1); }
.pop .row { margin-top: var(--space-3); }
.pop .prev { font-size: 14px; line-height: 22px; color: var(--ink); }
.pop .hint { margin-top: var(--space-2); font: 400 11px/16px var(--font-sans); color: var(--ink-muted); }
.selbtn { position: fixed; z-index: 90; background: var(--charcoal); color: var(--on-charcoal); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font: 500 14px/20px var(--font-sans); box-shadow: var(--shadow-sm); }
.selbtn:hover { background: var(--ink); }

.settings { position: fixed; top: calc(var(--top-h) + var(--space-2)); right: var(--space-3); width: 340px; max-height: calc(100vh - var(--top-h) - var(--space-6)); overflow: auto; z-index: 70;
  background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-5); }
.settings h3 { font: 700 20px/26px var(--font-sans); margin-bottom: var(--space-3); }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--border); font: 400 14px/20px var(--font-sans); color: var(--ink); }
.set-row:first-of-type { border-top: 0; }
.set-row .d { font: 400 12px/20px var(--font-sans); color: var(--ink-muted); }
.set-row select { padding: var(--space-2) var(--space-3); max-width: 140px; }
.set-row input[type=range] { max-width: 140px; }
.switch { position: relative; width: 44px; height: 24px; flex: none; border-radius: var(--radius-pill); background: var(--border-strong); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface); }
.switch.on { background: var(--charcoal); }
.switch.on::after { left: 23px; }
.set-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.set-actions .jf-btn { padding: 10px 14px; }

.modal { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: var(--space-5); background: color-mix(in srgb, var(--ink) 45%, transparent); }
.dlg { width: 440px; max-width: 100%; max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); padding: var(--space-6); }
.dlg:has(.role-cards) { width: 580px; }
.dlg h3 { font: 700 20px/26px var(--font-sans); margin-bottom: var(--space-1); }
.dlg .sub { font: 400 14px/22px var(--font-sans); color: var(--ink-muted); margin-bottom: var(--space-4); }
.dlg label { display: block; font: 500 13px/18px var(--font-sans); color: var(--ink); margin: var(--space-4) 0 var(--space-1); }
.dlg input, .dlg textarea, .dlg select { width: 100%; }
.dlg textarea { min-height: 96px; resize: vertical; line-height: 22px; }
.dlg .ref { background: var(--surface-warm); border-radius: var(--radius-md); padding: var(--space-3); font: 400 12px/20px var(--font-sans); color: var(--ink-muted); }
.dlg .acts { display: flex; gap: var(--space-2); justify-content: flex-end; margin-top: var(--space-6); }
.dlg .acts .left { margin-right: auto; }
.role-cards { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.role-card { text-align: left; display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-lg); }
.role-card b { font: 700 14px/20px var(--font-sans); color: var(--ink); }
.role-card span { font: 400 14px/22px var(--font-sans); color: var(--ink-muted); }
.role-card:hover { border-color: var(--ink); }

.toast { position: fixed; left: 50%; bottom: var(--space-6); transform: translateX(-50%); z-index: 130; display: flex; align-items: center; gap: var(--space-4);
  max-width: min(640px, calc(100vw - 32px)); padding: var(--space-3) var(--space-4); background: var(--ink); color: var(--on-charcoal); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); font: 400 14px/20px var(--font-sans); }
.toast button { color: var(--on-charcoal); font-weight: 500; text-decoration: underline; white-space: nowrap; }

/* ============================================================ Responsiv (keine Werte im Design-System definiert) */
@media (max-width: 1500px) { .seg-label { display: none; } }
@media (max-width: 1280px) { :root { --lw: 248px; --rw: 256px; } .extra-grid { grid-template-columns: 1fr 1fr; } .extra-grid .col-notes { grid-column: 1 / -1; } }
@media (max-width: 1060px) { .search kbd { display: none; } .stage:not(.no-right) { grid-template-columns: var(--lw) minmax(0, 1fr); } .stage:not(.no-right) .right { display: none; } }
@media (max-width: 800px) { .extra-grid, .extra-grid.only-rspr, .extra-grid.only-lit { grid-template-columns: 1fr; } .brand span:not(.law-pill) { display: none; } .role-cards { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }

<script>
/*
 * Rohtext StGB §§ 211–231 (Beispiel-Gesetzestext).
 * Format (wird von app.js geparst):
 *   "<Ordnungszahl> Abschnitt" + nächste Zeile = Abschnittstitel
 *   "§ 211 Titel"              = Beginn einer Norm   ("§§ 214 und 215 (weggefallen)" erlaubt)
 *   "(1) …"                    = Absatz
 *   "1. …"                     = Nummer
 *   "> …"                      = eingerückte Gruppe (z. B. Mordmerkmale-Gruppen)
 *   sonstige Zeile             = Fließtext / Satzfortsetzung
 *   "Fußnote" + Zeilen "§ x: …"= Fußnoten der Norm
 * Jede Zeile = ein Block (Zeilenumbrüche der Vorlage sind bereits aufgelöst).
 */
window.RAW_STGB = `Sechzehnter Abschnitt
Straftaten gegen das Leben
§ 211 Mord
(1) Der Mörder wird mit lebenslanger Freiheitsstrafe bestraft.
(2) Mörder ist, wer
> aus Mordlust, zur Befriedigung des Geschlechtstriebs, aus Habgier oder sonst aus niedrigen Beweggründen,
> heimtückisch oder grausam oder mit gemeingefährlichen Mitteln oder
> um eine andere Straftat zu ermöglichen oder zu verdecken,
einen Menschen tötet.
Fußnote
§ 211: Nach Maßgabe der Entscheidungsgründe mit dem GG vereinbar, BVerfGE v. 21.6.1977 I 1236 - 1 BvL 14/76 -
§ 212 Totschlag
(1) Wer einen Menschen tötet, ohne Mörder zu sein, wird als Totschläger mit Freiheitsstrafe nicht unter fünf Jahren bestraft.
(2) In besonders schweren Fällen ist auf lebenslange Freiheitsstrafe zu erkennen.
§ 213 Minder schwerer Fall des Totschlags
War der Totschläger ohne eigene Schuld durch eine ihm oder einem Angehörigen zugefügte Mißhandlung oder schwere Beleidigung von dem getöteten Menschen zum Zorn gereizt und hierdurch auf der Stelle zur Tat hingerissen worden oder liegt sonst ein minder schwerer Fall vor, so ist die Strafe Freiheitsstrafe von einem Jahr bis zu zehn Jahren.
§§ 214 und 215 (weggefallen)
§ 216 Tötung auf Verlangen
(1) Ist jemand durch das ausdrückliche und ernstliche Verlangen des Getöteten zur Tötung bestimmt worden, so ist auf Freiheitsstrafe von sechs Monaten bis zu fünf Jahren zu erkennen.
(2) Der Versuch ist strafbar.
§ 217 Geschäftsmäßige Förderung der Selbsttötung
(1) Wer in der Absicht, die Selbsttötung eines anderen zu fördern, diesem hierzu geschäftsmäßig die Gelegenheit gewährt, verschafft oder vermittelt, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft.
(2) Als Teilnehmer bleibt straffrei, wer selbst nicht geschäftsmäßig handelt und entweder Angehöriger des in Absatz 1 genannten anderen ist oder diesem nahesteht.
Fußnote
§ 217: IdF d. Art. 1 Nr. 2 G v. 3.12.2015 I 2177 mWv 10.12.2015; nach Maßgabe der Entscheidungsformel mit GG unvereinbar und nichtig gem. BVerfGE v. 26.2.2020 I 525 - 2 BvR 2347/15 u.a. -
§ 218 Schwangerschaftsabbruch
(1) Wer eine Schwangerschaft abbricht, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft. Handlungen, deren Wirkung vor Abschluß der Einnistung des befruchteten Eies in der Gebärmutter eintritt, gelten nicht als Schwangerschaftsabbruch im Sinne dieses Gesetzes.
(2) In besonders schweren Fällen ist die Strafe Freiheitsstrafe von sechs Monaten bis zu fünf Jahren. Ein besonders schwerer Fall liegt in der Regel vor, wenn der Täter
1. gegen den Willen der Schwangeren handelt oder
2. leichtfertig die Gefahr des Todes oder einer schweren Gesundheitsschädigung der Schwangeren verursacht.
(3) Begeht die Schwangere die Tat, so ist die Strafe Freiheitsstrafe bis zu einem Jahr oder Geldstrafe.
(4) Der Versuch ist strafbar. Die Schwangere wird nicht wegen Versuchs bestraft.
Fußnote
§§ 218 bis 219b (früher §§ 218 bis 219d): IdF d. Art. 13 Nr. 1 G v. 27.7.1992 I 1398 mWv 5.8.1992; Art. 13 Nr. 1 trat einstweilen nicht in Kraft gem. BVerfGE v. 4.8.1992 I 1585 - 2 BvQ 16/92 u. a. -; die einstweilige Anordnung v. 4.8.1992 wurde nach BVerfGE v. 25.1.1993 I 270 wiederholt.
§ 218: Anwendbar ab 16.6.1993 gem. Abschn. II Nr. 1 nach Maßgabe der Nr. 2 bis 9 der Entscheidungsformel gem. BVerfGE v. 28.5.1993 I 820 - 2 BvF 2/90 u. a. -
§ 218a Straflosigkeit des Schwangerschaftsabbruchs
(1) Der Tatbestand des § 218 ist nicht verwirklicht, wenn
1. die Schwangere den Schwangerschaftsabbruch verlangt und dem Arzt durch eine Bescheinigung nach § 219 Abs. 2 Satz 2 nachgewiesen hat, daß sie sich mindestens drei Tage vor dem Eingriff hat beraten lassen,
2. der Schwangerschaftsabbruch von einem Arzt vorgenommen wird und
3. seit der Empfängnis nicht mehr als zwölf Wochen vergangen sind.
(2) Der mit Einwilligung der Schwangeren von einem Arzt vorgenommene Schwangerschaftsabbruch ist nicht rechtswidrig, wenn der Abbruch der Schwangerschaft unter Berücksichtigung der gegenwärtigen und zukünftigen Lebensverhältnisse der Schwangeren nach ärztlicher Erkenntnis angezeigt ist, um eine Gefahr für das Leben oder die Gefahr einer schwerwiegenden Beeinträchtigung des körperlichen oder seelischen Gesundheitszustandes der Schwangeren abzuwenden, und die Gefahr nicht auf eine andere für sie zumutbare Weise abgewendet werden kann.
(3) Die Voraussetzungen des Absatzes 2 gelten bei einem Schwangerschaftsabbruch, der mit Einwilligung der Schwangeren von einem Arzt vorgenommen wird, auch als erfüllt, wenn nach ärztlicher Erkenntnis an der Schwangeren eine rechtswidrige Tat nach den §§ 176 bis 178 des Strafgesetzbuches begangen worden ist, dringende Gründe für die Annahme sprechen, daß die Schwangerschaft auf der Tat beruht, und seit der Empfängnis nicht mehr als zwölf Wochen vergangen sind.
(4) Die Schwangere ist nicht nach § 218 strafbar, wenn der Schwangerschaftsabbruch nach Beratung (§ 219) von einem Arzt vorgenommen worden ist und seit der Empfängnis nicht mehr als zweiundzwanzig Wochen verstrichen sind. Das Gericht kann von Strafe nach § 218 absehen, wenn die Schwangere sich zur Zeit des Eingriffs in besonderer Bedrängnis befunden hat.
Fußnote
§§ 218 bis 219b (früher §§ 218 bis 219d): IdF d. Art. 13 Nr. 1 G v. 27.7.1992 I 1398 mWv 5.8.1992; Art. 13 Nr. 1 trat einstweilen nicht in Kraft gem. BVerfGE v. 4.8.1992 I 1585 - 2 BvQ 16/92 u. a. -; die einstweilige Anordnung v. 4.8.1992 wurde nach BVerfGE v. 25.1.1993 I 270 wiederholt.
§ 218a Abs. 4: Anwendbar ab 16.6.1993 gem. Abschn. II Nr. 1 nach Maßgabe der Nr. 2 bis 9 der Entscheidungsformel gem. BVerfGE v. 28.5.1993 - 2 BvF 2/90 u. a. -
§ 218b Schwangerschaftsabbruch ohne ärztliche Feststellung; unrichtige ärztliche Feststellung
(1) Wer in den Fällen des § 218a Abs. 2 oder 3 eine Schwangerschaft abbricht, ohne daß ihm die schriftliche Feststellung eines Arztes, der nicht selbst den Schwangerschaftsabbruch vornimmt, darüber vorgelegen hat, ob die Voraussetzungen des § 218a Abs. 2 oder 3 gegeben sind, wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft, wenn die Tat nicht in § 218 mit Strafe bedroht ist. Wer als Arzt wider besseres Wissen eine unrichtige Feststellung über die Voraussetzungen des § 218a Abs. 2 oder 3 zur Vorlage nach Satz 1 trifft, wird mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe bestraft, wenn die Tat nicht in § 218 mit Strafe bedroht ist. Die Schwangere ist nicht nach Satz 1 oder 2 strafbar.
(2) Ein Arzt darf Feststellungen nach § 218a Abs. 2 oder 3 nicht treffen, wenn ihm die zuständige Stelle dies untersagt hat, weil er wegen einer rechtswidrigen Tat nach Absatz 1, den §§ 218 oder 219b oder wegen einer anderen rechtswidrigen Tat, die er im Zusammenhang mit einem Schwangerschaftsabbruch begangen hat, rechtskräftig verurteilt worden ist. Die zuständige Stelle kann einem Arzt vorläufig untersagen, Feststellungen nach § 218a Abs. 2 und 3 zu treffen, wenn gegen ihn wegen des Verdachts einer der in Satz 1 bezeichneten rechtswidrigen Taten das Hauptverfahren eröffnet worden ist.
Fußnote
§§ 218 bis 219b (früher §§ 218 bis 219d): IdF d. Art. 13 Nr. 1 G v. 27.7.1992 I 1398 mWv 5.8.1992; Art. 13 Nr. 1 trat einstweilen nicht in Kraft gem. BVerfGE v. 4.8.1992 I 1585 - 2 BvQ 16/92 u. a. -; die einstweilige Anordnung v. 4.8.1992 wurde nach BVerfGE v. 25.1.1993 I 270 wiederholt.
§ 218b: Anwendbar ab 16.6.1993 gem. Abschn. II Nr. 1 nach Maßgabe der Nr. 2 bis 9 der Entscheidungsformel gem. BVerfGE v. 28.5.1993 - 2 BvF 2/90 u. a. -
§ 218c Ärztliche Pflichtverletzung bei einem Schwangerschaftsabbruch
(1) Wer eine Schwangerschaft abbricht,
1. ohne der Frau Gelegenheit gegeben zu haben, ihm die Gründe für ihr Verlangen nach Abbruch der Schwangerschaft darzulegen,
2. ohne die Schwangere über die Bedeutung des Eingriffs, insbesondere über Ablauf, Folgen, Risiken, mögliche physische und psychische Auswirkungen ärztlich beraten zu haben,
3. ohne sich zuvor in den Fällen des § 218a Abs. 1 und 3 auf Grund ärztlicher Untersuchung von der Dauer der Schwangerschaft überzeugt zu haben oder
4. obwohl er die Frau in einem Fall des § 218a Abs. 1 nach § 219 beraten hat,
wird mit Freiheitsstrafe bis zu einem Jahr oder mit Geldstrafe bestraft, wenn die Tat nicht in § 218 mit Strafe bedroht ist.
(2) Die Schwangere ist nicht nach Absatz 1 strafbar.
§ 219 Beratung der Schwangeren in einer Not- und Konfliktlage
(1) Die Beratung dient dem Schutz des ungeborenen Lebens. Sie hat sich von dem Bemühen leiten zu lassen, die Frau zur Fortsetzung der Schwangerschaft zu ermutigen und ihr Perspektiven für ein Leben mit dem Kind zu eröffnen; sie soll ihr helfen, eine verantwortliche und gewissenhafte Entscheidung zu treffen. Dabei muß der Frau bewußt sein, daß das Ungeborene in jedem Stadium der Schwangerschaft auch ihr gegenüber ein eigenes Recht auf Leben hat und daß deshalb nach der Rechtsordnung ein Schwangerschaftsabbruch nur in Ausnahmesituationen in Betracht kommen kann, wenn der Frau durch das Austragen des Kindes eine Belastung erwächst, die so schwer und außergewöhnlich ist, daß sie die zumutbare Opfergrenze übersteigt. Die Beratung soll durch Rat und Hilfe dazu beitragen, die in Zusammenhang mit der Schwangerschaft bestehende Konfliktlage zu bewältigen und einer Notlage abzuhelfen. Das Nähere regelt das Schwangerschaftskonfliktgesetz.
(2) Die Beratung hat nach dem Schwangerschaftskonfliktgesetz durch eine anerkannte Schwangerschaftskonfliktberatungsstelle zu erfolgen. Die Beratungsstelle hat der Schwangeren nach Abschluß der Beratung hierüber eine mit dem Datum des letzten Beratungsgesprächs und dem Namen der Schwangeren versehene Bescheinigung nach Maßgabe des Schwangerschaftskonfliktgesetzes auszustellen. Der Arzt, der den Abbruch der Schwangerschaft vornimmt, ist als Berater ausgeschlossen.
§ 219a (weggefallen)
§ 219b Inverkehrbringen von Mitteln zum Abbruch der Schwangerschaft
(1) Wer in der Absicht, rechtswidrige Taten nach § 218 zu fördern, Mittel oder Gegenstände, die zum Schwangerschaftsabbruch geeignet sind, in den Verkehr bringt, wird mit Freiheitsstrafe bis zu zwei Jahren oder mit Geldstrafe bestraft.
(2) Die Teilnahme der Frau, die den Abbruch ihrer Schwangerschaft vorbereitet, ist nicht nach Absatz 1 strafbar.
(3) Mittel oder Gegenstände, auf die sich die Tat bezieht, können eingezogen werden.
Fußnote
§§ 218 bis 219b (früher §§ 218 bis 219d): IdF d. Art. 13 Nr. 1 G v. 27.7.1992 I 1398 mWv 5.8.1992; Art. 13 Nr. 1 trat einstweilen nicht in Kraft gem. BVerfGE v. 4.8.1992 I 1585 - 2 BvQ 16/92 u. a. -; die einstweilige Anordnung v. 4.8.1992 wurde nach BVerfGE v. 25.1.1993 I 270 wiederholt.

§ 221 Aussetzung
(1) Wer einen Menschen
1. in eine hilflose Lage versetzt oder
2. in einer hilflosen Lage im Stich läßt, obwohl er ihn in seiner Obhut hat oder ihm sonst beizustehen verpflichtet ist,
und ihn dadurch der Gefahr des Todes oder einer schweren Gesundheitsschädigung aussetzt, wird mit Freiheitsstrafe von drei Monaten bis zu fünf Jahren bestraft.
(2) Auf Freiheitsstrafe von einem Jahr bis zu zehn Jahren ist zu erkennen, wenn der Täter
1. die Tat gegen sein Kind oder eine Person begeht, die ihm zur Erziehung oder zur Betreuung in der Lebensführung anvertraut ist, oder
2. durch die Tat eine schwere Gesundheitsschädigung des Opfers verursacht.
(3) Verursacht der Täter durch die Tat den Tod des Opfers, so ist die Strafe Freiheitsstrafe nicht unter drei Jahren.
(4) In minder schweren Fällen des Absatzes 2 ist auf Freiheitsstrafe von sechs Monaten bis zu fünf Jahren, in minder schweren Fällen des Absatzes 3 auf Freiheitsstrafe von einem Jahr bis zu zehn Jahren zu erkennen.
§ 222 Fahrlässige Tötung
Wer durch Fahrlässigkeit den Tod eines Menschen verursacht, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.
Siebzehnter Abschnitt
Straftaten gegen die körperliche Unversehrtheit
§ 223 Körperverletzung
(1) Wer eine andere Person körperlich mißhandelt oder an der Gesundheit schädigt, wird mit Freiheitsstrafe bis zu fünf Jahren oder mit Geldstrafe bestraft.
(2) Der Versuch ist strafbar.
§ 224 Gefährliche Körperverletzung
(1) Wer die Körperverletzung
1. durch Beibringung von Gift oder anderen gesundheitsschädlichen Stoffen,
2. mittels einer Waffe oder eines anderen gefährlichen Werkzeugs,
3. mittels eines hinterlistigen Überfalls,
4. mit einem anderen Beteiligten gemeinschaftlich oder
5. mittels einer das Leben gefährdenden Behandlung
begeht, wird mit Freiheitsstrafe von sechs Monaten bis zu zehn Jahren, in minder schweren Fällen mit Freiheitsstrafe von drei Monaten bis zu fünf Jahren bestraft.
(2) Der Versuch ist strafbar.
§ 225 Mißhandlung von Schutzbefohlenen
(1) Wer eine Person unter achtzehn Jahren oder eine wegen Gebrechlichkeit oder Krankheit wehrlose Person, die
1. seiner Fürsorge oder Obhut untersteht,
2. seinem Hausstand angehört,
3. von dem Fürsorgepflichtigen seiner Gewalt überlassen worden oder
4. ihm im Rahmen eines Dienst- oder Arbeitsverhältnisses untergeordnet ist,
quält oder roh mißhandelt, oder wer durch böswillige Vernachlässigung seiner Pflicht, für sie zu sorgen, sie an der Gesundheit schädigt, wird mit Freiheitsstrafe von sechs Monaten bis zu zehn Jahren bestraft.
(2) Der Versuch ist strafbar.
(3) Auf Freiheitsstrafe nicht unter einem Jahr ist zu erkennen, wenn der Täter die schutzbefohlene Person durch die Tat in die Gefahr
1. des Todes oder einer schweren Gesundheitsschädigung oder
2. einer erheblichen Schädigung der körperlichen oder seelischen Entwicklung
bringt.
(4) In minder schweren Fällen des Absatzes 1 ist auf Freiheitsstrafe von drei Monaten bis zu fünf Jahren, in minder schweren Fällen des Absatzes 3 auf Freiheitsstrafe von sechs Monaten bis zu fünf Jahren zu erkennen.
§ 226 Schwere Körperverletzung
(1) Hat die Körperverletzung zur Folge, daß die verletzte Person
1. das Sehvermögen auf einem Auge oder beiden Augen, das Gehör, das Sprechvermögen oder die Fortpflanzungsfähigkeit verliert,
2. ein wichtiges Glied des Körpers verliert oder dauernd nicht mehr gebrauchen kann oder
3. in erheblicher Weise dauernd entstellt wird oder in Siechtum, Lähmung oder geistige Krankheit oder Behinderung verfällt,
so ist die Strafe Freiheitsstrafe von einem Jahr bis zu zehn Jahren.
(2) Verursacht der Täter eine der in Absatz 1 bezeichneten Folgen absichtlich oder wissentlich, so ist die Strafe Freiheitsstrafe nicht unter drei Jahren.
(3) In minder schweren Fällen des Absatzes 1 ist auf Freiheitsstrafe von sechs Monaten bis zu fünf Jahren, in minder schweren Fällen des Absatzes 2 auf Freiheitsstrafe von einem Jahr bis zu zehn Jahren zu erkennen.
§ 226a Verstümmelung weiblicher Genitalien
(1) Wer die äußeren Genitalien einer weiblichen Person verstümmelt, wird mit Freiheitsstrafe nicht unter einem Jahr bestraft.
(2) In minder schweren Fällen ist auf Freiheitsstrafe von sechs Monaten bis zu fünf Jahren zu erkennen.
§ 227 Körperverletzung mit Todesfolge
(1) Verursacht der Täter durch die Körperverletzung (§§ 223 bis 226a) den Tod der verletzten Person, so ist die Strafe Freiheitsstrafe nicht unter drei Jahren.
(2) In minder schweren Fällen ist auf Freiheitsstrafe von einem Jahr bis zu zehn Jahren zu erkennen.
§ 228 Einwilligung
Wer eine Körperverletzung mit Einwilligung der verletzten Person vornimmt, handelt nur dann rechtswidrig, wenn die Tat trotz der Einwilligung gegen die guten Sitten verstößt.
§ 229 Fahrlässige Körperverletzung
Wer durch Fahrlässigkeit die Körperverletzung einer anderen Person verursacht, wird mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft.
§ 230 Strafantrag
(1) Die vorsätzliche Körperverletzung nach § 223 und die fahrlässige Körperverletzung nach § 229 werden nur auf Antrag verfolgt, es sei denn, daß die Strafverfolgungsbehörde wegen des besonderen öffentlichen Interesses an der Strafverfolgung ein Einschreiten von Amts wegen für geboten hält. Stirbt die verletzte Person, so geht bei vorsätzlicher Körperverletzung das Antragsrecht nach § 77 Abs. 2 auf die Angehörigen über.
(2) Ist die Tat gegen einen Amtsträger, einen für den öffentlichen Dienst besonders Verpflichteten oder einen Soldaten der Bundeswehr während der Ausübung seines Dienstes oder in Beziehung auf seinen Dienst begangen, so wird sie auch auf Antrag des Dienstvorgesetzten verfolgt. Dasselbe gilt für Träger von Ämtern der Kirchen und anderen Religionsgesellschaften des öffentlichen Rechts.
§ 231 Beteiligung an einer Schlägerei
(1) Wer sich an einer Schlägerei oder an einem von mehreren verübten Angriff beteiligt, wird schon wegen dieser Beteiligung mit Freiheitsstrafe bis zu drei Jahren oder mit Geldstrafe bestraft, wenn durch die Schlägerei oder den Angriff der Tod eines Menschen oder eine schwere Körperverletzung (§ 226) verursacht worden ist.
(2) Nach Absatz 1 ist nicht strafbar, wer an der Schlägerei oder dem Angriff beteiligt war, ohne daß ihm dies vorzuwerfen ist.

<script>
/* Normfenster – Prototyp. Reines JavaScript, keine Abhängigkeiten, läuft auch per file://. */
(function () {
'use strict';

const META = window.STGB_META;
const STORE_KEY = 'normfenster.v1';
const MAXPANES = 3;
const READ_SECS = 20;           // ab so vielen Sekunden Verweildauer gilt eine Norm als „gelesen“

/* ================================================================ Helpers */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const sortKey = id => { const m = /^(\d+)([a-z]?)$/.exec(id); return m ? +m[1] * 100 + (m[2] ? m[2].charCodeAt(0) - 96 : 0) : 0; };
const inRange = (id, a, b) => sortKey(id) >= sortKey(a) && sortKey(id) <= sortKey(b);
const par = id => '§ ' + id;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

const ICON = {
  star:  '<svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8L12 3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" width="17" height="17"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8 6.8 19.6l1-5.8L3.5 9.7l5.9-.8L12 3.5z" fill="var(--star)" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',

};

/* ================================================================ Gesetz parsen */
function parseLaw(raw) {
  const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(l => l && l !== '-');
  const norms = {}, order = [], sections = [];
  let section = null, curList = [], foot = false;

  const classify = line => {
    let m;
    if ((m = /^\((\d+[a-z]?)\)\s+(.*)$/.exec(line))) return { t: 'abs', n: m[1], text: m[2] };
    if ((m = /^(\d+)\.\s+(.*)$/.exec(line)))         return { t: 'nr',  n: m[1], text: m[2] };
    if ((m = /^>\s*(.*)$/.exec(line)))                return { t: 'grp', text: m[1] };
    return { t: 'txt', text: line };
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let m;
    if ((m = /^(\S+) Abschnitt$/.exec(line))) {
      section = { label: m[1], nr: META.sectionNr[m[1]] || sections.length + 1, title: lines[++i], norms: [] };
      sections.push(section); curList = []; foot = false; continue;
    }
    if (line === 'Fußnote') { foot = true; continue; }
    if (line.startsWith('§')) {
      if (foot && line.includes(':')) { curList.forEach(n => n.foot.push(line)); continue; }
      const h = /^§§? (\d+[a-z]?)(?: und (\d+[a-z]?))?\s*(.*)$/.exec(line);
      if (!h) continue;
      const gone = h[3] === '(weggefallen)';
      curList = [h[1], h[2]].filter(Boolean).map(id => {
        const n = { id, title: gone ? '(weggefallen)' : h[3], gone, blocks: [], foot: [], section };
        norms[id] = n; order.push(id); section.norms.push(id); return n;
      });
      foot = false; continue;
    }
    if (foot) { curList.forEach(n => { n.foot[n.foot.length - 1] += ' ' + line; }); continue; }
    const blk = classify(line);
    curList.forEach(n => n.blocks.push(blk));
  }
  order.forEach(id => { const n = norms[id]; n.plain = n.blocks.map(b => b.text).join(' ').toLowerCase(); });
  sections.forEach(s => { s.first = s.norms[0]; s.last = s.norms[s.norms.length - 1]; });
  return { norms, order, sections };
}
const LAW = parseLaw(window.RAW_STGB);
const M = id => META.norms[id] || null;

// Rückwärts-Graph: welche Normen verlinken (per Tag) auf id?
const REV = {};
Object.keys(META.norms).forEach(src => META.norms[src].tags.forEach(([t]) => { (REV[t] = REV[t] || []).push(src); }));

  history: [], stats: {}, bookmarks: [], customDefs: {}, customTags: {}, notes: {}, finds: {}, last: null
};
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s) return Object.assign({}, DEFAULT, s, { settings: Object.assign({}, DEFAULT.settings, s.settings) });
  } catch (e) { /* Storage nicht verfügbar */ }
  return JSON.parse(JSON.stringify(DEFAULT));
}
let S = loadState();
let storageOk = true;
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { storageOk = false; } };
const saveSoon = debounce(save, 400);

const ui = { panes: [], focus: 0, leftTab: 'history', extraFilter: 'all', activeAbs: null };

/* ---- Rolle: Studium vs. Praxis ---------------------------------------------------------
   Studium: Lernhilfen (Kurz erklärt, Begriffe, Lernstand, Prüfungsrelevanz), Aufsätze/Übungs-/Examensfälle zuerst.
   Praxis : ruhiger Text, Kommentare + aktuelle Rechtsprechung zuerst, Fußnoten offen, kein Lernstand-Tracking. */
const role = () => (S.settings.role === 'pro' ? 'pro' : 'student');
const ROLE_PRESET = { student: { explain: true, defs: true }, pro: { explain: false, defs: false } };
const LIT_CATS = [['kommentar', 'Kommentare'], ['lehrbuch', 'Lehrbücher'], ['aufsatz', 'Aufsätze und Anmerkungen'], ['fall', 'Übungs- und Examensfälle']];
function litCats() {
  const d = DEFAULT.settings.litCats[role()];

/* ================================================================ Lernstand-Analyse (regelbasiert) */
function attention(id) { const s = S.stats[id]; return s ? Math.min(1, s.visits / 3 + s.secs / 90) : 0; }
function isRead(id) { const s = S.stats[id]; return !!s && (s.secs >= READ_SECS || s.visits >= 2); }
function learnItems() {
  return LAW.order.filter(id => !LAW.norms[id].gone && M(id)).map(id => {
    const m = M(id), s = S.stats[id] || { visits: 0, secs: 0 };
    const neigh = Array.from(new Set(m.tags.map(t => t[0]).concat(REV[id] || []))).filter(x => LAW.norms[x] && !LAW.norms[x].gone && x !== id);
    let best = null; neigh.forEach(x => { const a = attention(x); if (!best || a > best.a) best = { id: x, a }; });
    const gap = (m.imp / 5) * (1 - attention(id));
    const boost = 1 + 0.9 * (best ? best.a : 0);
    return { id, imp: m.imp, s, gap, score: gap * boost, best };
  });
}
function renderLearn() {
  const items = learnItems();
  const total = items.length, read = items.filter(x => isRead(x.id)).length;
  const touched = Object.values(S.stats).reduce((a, s) => a + (s.visits || 0), 0);
  const topics = META.topics.map(t => {
    const ids = t.ids.filter(id => LAW.norms[id] && !LAW.norms[id].gone);
    const r = ids.filter(isRead).length;
    return '<div class="topic-row"><div class="l"><span>' + esc(t.label) + '</span><span>' + r + '/' + ids.length + '</span></div><div class="bar ' + (r === ids.length ? 'good' : '') + '"><i style="width:' + (ids.length ? r / ids.length * 100 : 0) + '%"></i></div></div>';
  }).join('');
  let recs;
  if (touched < 3) recs = '<div class="empty-note">Sobald du ein paar Normen gelesen hast, erscheinen hier Empfehlungen.<br><button class="linkbtn" data-act="demo">Demo-Daten laden</button></div>';
  else {
    const top = items.filter(x => x.score > 0.12).sort((a, b) => b.score - a.score).slice(0, 5);
    recs = top.length ? top.map(x => {
      const why = ['Prüfungsrelevanz ' + x.imp + ' von 5', x.s.visits ? x.s.visits + '× geöffnet, ' + fmtSecs(x.s.secs) + ' gelesen' : 'noch nie geöffnet'];
      if (x.best && x.best.a >= 0.5) why.push('hängt zusammen mit ' + par(x.best.id) + ' (' + (stat(x.best.id).visits) + '× gelesen)');
      return '<div class="rec" data-nav="' + x.id + '"><div class="h"><b>' + par(x.id) + ' ' + esc(LAW.norms[x.id].title) + '</b><span class="pri">' + (x.score > 0.7 ? 'wichtig' : 'nachholen') + '</span></div><div class="why">' + why.join(' · ') + '</div></div>';
    }).join('') : '<div class="empty-note">Keine auffälligen Lücken.</div>';
  }
  return '<div class="card-s"><h4>Gelesen: ' + read + ' von ' + total + ' Normen</h4><div class="bar ' + (read === total ? 'good' : '') + '"><i style="width:' + (total ? read / total * 100 : 0) + '%"></i></div></div>' +
    '<div class="card-s"><h4>Themenblöcke</h4>' + topics + '</div>' +
    '<div class="group-label">Lernlücken · diese Normen fehlen dir</div><div class="recs">' + recs + '</div>' +
    '<div class="fine">Regelbasierte Mustererkennung: Prüfungsrelevanz × Verknüpfung mit oft gelesenen Normen × bisherige Verweildauer. Als „gelesen“ zählt eine Norm ab ' + READ_SECS + ' Sek. Verweildauer oder 2 Besuchen. Alles bleibt lokal in deinem Browser.</div>';
}

  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];

/* ================================================================ Suche */
const qEl = $('#q'), resEl = $('#results'); let resSel = 0, resList = [];
function runSearch(raw) {
  const q = raw.trim().toLowerCase(); if (!q) return [];
  const num = q.replace(/^§+\s*/, '').replace(/\s+/g, '');
  const out = [];
  LAW.order.forEach(id => {
    const n = LAW.norms[id]; let score = 0, snip = '';
    if (/^\d+[a-z]?$/.test(num)) { if (id === num) score = 100; else if (id.startsWith(num)) score = 70; }
    const t = n.title.toLowerCase();
    if (!score && t.includes(q)) score = 60 + (t.startsWith(q) ? 5 : 0);
    if (!score && q.length >= 3) { const k = n.plain.indexOf(q); if (k >= 0) { score = 30; snip = n.plain.slice(Math.max(0, k - 40), k + q.length + 60); } }
    if (!score && q.length >= 4) {
      const d = META.defs.find(x => x.in.includes(id) && (x.term.toLowerCase().includes(q) || (x.sub || []).some(s => s.term.toLowerCase().includes(q))));
      if (d) { score = 20; snip = 'Begriff: ' + d.term; }
    }
    if (score) out.push({ id, score: score - (n.gone ? 25 : 0), snip });
  });
  return out.sort((a, b) => b.score - a.score || sortKey(a.id) - sortKey(b.id)).slice(0, 8);
}
function renderResults() {
  const q = qEl.value; resList = runSearch(q);
  if (!q.trim()) { resEl.hidden = true; qEl.setAttribute('aria-expanded', 'false'); return; }
  resEl.hidden = false; qEl.setAttribute('aria-expanded', 'true'); resSel = 0;
  const hl = s => esc(s).replace(new RegExp('(' + escRe(esc(q.trim())) + ')', 'ig'), '<mark>$1</mark>');
  resEl.innerHTML = resList.length ? resList.map((r, i) => '<div role="option" aria-selected="' + (i === 0) + '" class="res' + (i === 0 ? ' sel' : '') + '" data-res="' + r.id + '"><span><b>' + par(r.id) + '</b> ' + hl(LAW.norms[r.id].title) + '</span>' +
    '<small>' + esc(LAW.norms[r.id].section.nr + '. Abschnitt') + (r.snip ? ' · …' + hl(r.snip) + '…' : '') + '</small></div>').join('') : '<div class="empty">Keine Treffer im Beispieltext.</div>';
}
function pickResult(id, split) { resEl.hidden = true; qEl.value = ''; qEl.blur(); go(id, { mode: split ? 'split' : 'replace' }); }
qEl.addEventListener('input', renderResults);
qEl.addEventListener('focus', renderResults);
qEl.addEventListener('keydown', e => {
  const rows = $$('.res', resEl);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!rows.length) return;
    resSel = (resSel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
    rows.forEach((r, i) => { r.classList.toggle('sel', i === resSel); r.setAttribute('aria-selected', i === resSel); });
  } else if (e.key === 'Enter') { const r = resList[resSel]; if (r) pickResult(r.id, e.shiftKey); }
  else if (e.key === 'Escape') { resEl.hidden = true; qEl.blur(); }
});
resEl.addEventListener('mousedown', e => { const r = e.target.closest('.res'); if (r) { e.preventDefault(); pickResult(r.dataset.res, e.shiftKey); } });
document.addEventListener('mousedown', e => { if (!e.target.closest('.search')) resEl.hidden = true; });

/* ================================================================ Einstellungen */
const setEl = $('#settings');
function renderSettings() {
  const sw = (k, on) => '<button class="switch' + (on ? ' on' : '') + '" role="switch" aria-checked="' + on + '" data-sw="' + k + '"></button>';
  setEl.innerHTML = '<h3>Einstellungen.</h3>' +
    '<div class="set-row"><div><div>Ansicht</div><div class="d">Passt Lernhilfen, Literatur-Reihenfolge und Lernstand an. Beim Wechsel werden „Kurz erklärt“ und Begriffe auf die Rollen-Voreinstellung gesetzt.</div></div><select data-sel="role"><option value="student"' + (role() === 'student' ? ' selected' : '') + '>Studium</option><option value="pro"' + (role() === 'pro' ? ' selected' : '') + '>Praxis</option></select></div>' +
    '<div class="set-row"><div><div>Verweise öffnen als</div><div class="d">Splitscreen im selben Tab oder neuer Browser-Tab</div></div><select data-sel="linkMode"><option value="split"' + (S.settings.linkMode === 'split' ? ' selected' : '') + '>Splitscreen</option><option value="tab"' + (S.settings.linkMode === 'tab' ? ' selected' : '') + '>Neuer Tab</option></select></div>' +
    '<div class="set-row"><div><div>„Kurz erklärt“ anzeigen</div><div class="d">Klartext-Zusammenfassung je Norm</div></div>' + sw('explain', S.settings.explain) + '</div>' +
    '<div class="set-row"><div><div>Begriffe hervorheben</div><div class="d">Definitionen beim Drüberhovern</div></div>' + sw('defs', S.settings.defs) + '</div>' +
    '<div class="set-row"><div><div>Weggefallene Normen zeigen</div></div>' + sw('showGone', S.settings.showGone) + '</div>' +
    '<div class="set-row"><div>Schriftgröße</div><input type="range" min="14" max="22" step="1" value="' + S.settings.fs + '" data-range="fs"></div>' +
    '<div class="set-actions"><button class="jf-btn jf-btn--secondary" data-act="demo">Demo-Daten laden</button><button class="jf-btn jf-btn--secondary" data-act="export">Daten exportieren</button><button class="jf-btn jf-btn--secondary" data-act="import">Importieren</button><button class="jf-btn jf-btn--secondary" data-act="reset">Alles zurücksetzen</button></div>' +
    (storageOk ? '' : '<div class="jf-note jf-note--foxxy" style="margin-top:var(--space-3)"><div class="jf-note__label">Speicher nicht verfügbar</div><div class="jf-note__body">Änderungen gehen beim Schließen des Browsers verloren.</div></div>');
}
$('#btnSettings').onclick = e => { e.stopPropagation(); if (setEl.hidden) { renderSettings(); setEl.hidden = false; } else setEl.hidden = true; };
document.addEventListener('mousedown', e => { if (!setEl.hidden && !e.target.closest('#settings, #btnSettings')) setEl.hidden = true; });
setEl.addEventListener('click', e => {
  const sw = e.target.closest('[data-sw]');
  if (sw) { S.settings[sw.dataset.sw] = !S.settings[sw.dataset.sw]; save(); renderSettings(); renderPanes(); renderChrome(); return; }
});
setEl.addEventListener('change', e => {
  const sel = e.target.closest('[data-sel]'); if (!sel) return;
  if (sel.dataset.sel === 'role') { applyRole(sel.value); renderSettings(); return; }
  S.settings[sel.dataset.sel] = sel.value; save(); renderPanes(); renderChrome();
});
setEl.addEventListener('input', e => {
  const r = e.target.closest('[data-range]'); if (!r) return;
  S.settings[r.dataset.range] = +r.value; saveSoon(); renderTop();
});

/* ---- Demo / Export / Import / Reset */
function loadDemo() {
  const now = Date.now(), H = 3600e3, D = 24 * H;
  const plan = [['211', 6, 340, 2 * D + 3 * H], ['212', 5, 260, 2 * D + 2 * H], ['222', 3, 120, 2 * D], ['223', 6, 300, D + 5 * H], ['224', 4, 210, D + 3 * H],
    ['218', 2, 90, D], ['218a', 3, 140, 4 * H], ['219', 1, 25, 3 * H], ['225', 1, 12, 2 * H], ['229', 2, 45, H]];
  S.stats = {}; S.history = [];
  plan.forEach(([id, v, secs, ago_]) => { S.stats[id] = { visits: v, secs, last: now - ago_ }; });
  S.history = plan.map(([id, , , ago_]) => ({ id, ts: now - ago_ })).sort((a, b) => b.ts - a.ts);
  S.bookmarks = ['211', '212', '223'];
  save(); renderAll(); toast('Demo-Daten geladen – schau in „Lernstand“.', { label: 'Lernstand öffnen', fn: () => { ui.leftTab = 'learn'; renderLeft(); } });
}
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'normfenster-daten.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importData() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => { try { const d = JSON.parse(rd.result); S = Object.assign({}, DEFAULT, d, { settings: Object.assign({}, DEFAULT.settings, d.settings) }); save(); renderAll(); toast('Daten importiert'); } catch (err) { toast('Datei konnte nicht gelesen werden'); } };
    rd.readAsText(f);
  };
  inp.click();
}

/* ================================================================ Globale Klick-Behandlung */
document.addEventListener('click', e => {
  const t = e.target;

  const dt = t.closest('[data-deltag]');
  if (dt) { e.preventDefault(); const id = focusId(); (S.customTags[id] || []).splice(+dt.dataset.deltag, 1); save(); renderTags(); return; }

  // Verweise im Text + Tags
  const xr =t.closest('a.xref:not(.ext), a.chip[data-norm]');
  if (xr) {
    if (e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;       // Browser-Standard: neuer Tab/Fenster
    e.preventDefault(); hidePop();
    const id = xr.dataset.norm;
    if (S.settings.linkMode === 'tab' && !xr.closest('.nrow')) { window.open(location.href.split('#')[0] + '#/stgb/' + id, '_blank'); return; }
    go(id, { mode: 'split', from: focusedPaneFromEl(xr), abs: xr.dataset.abs }); return;
  }
  if (t.closest('a.xref.ext, a.chip.ext')) return;       // externer Link: Browser-Standard (neuer Tab)

  // Navigation in Seitenleisten (ersetzt die aktive Norm)
  const nav = t.closest('[data-nav]');
  if (nav && !t.closest('[data-unbm]')) {
    if (e.ctrlKey || e.metaKey || e.shiftKey) return;
    e.preventDefault(); go(nav.dataset.nav, { mode: 'replace' }); return;
  }
  const crumb = t.closest('[data-go]'); if (crumb) { go(crumb.dataset.go, { mode: 'replace' }); return; }
  const secgo = t.closest('[data-secgo]'); if (secgo) { go(secgo.dataset.secgo, { mode: 'replace' }); return; }

  const unbm = t.closest('[data-unbm]'); if (unbm) { e.preventDefault(); toggleBm(unbm.dataset.unbm); return; }
  const tab = t.closest('[data-tab]'); if (tab) { ui.leftTab = tab.dataset.tab; renderLeft(); return; }
  const lm = t.closest('[data-linkmode]'); if (lm) { S.settings.linkMode = lm.dataset.linkmode; save(); renderTop(); toast(lm.dataset.linkmode === 'split' ? 'Verweise öffnen im Splitscreen' : 'Verweise öffnen in neuem Tab'); return; }
  const lc = t.closest('[data-litcat]');
  if (lc) { const r = role(), cur = litCats(); S.settings.litCats = S.settings.litCats || {}; S.settings.litCats[r] = Object.assign({}, cur, { [lc.dataset.litcat]: !cur[lc.dataset.litcat] }); save(); renderExtra(); return; }
  const rb = t.closest('[data-role]'); if (rb) { if (rb.dataset.role !== role() || rb.closest('.role-cards')) applyRole(rb.dataset.role, rb.closest('.role-cards') && rb.dataset.role === 'student'); return; }
  const flt = t.closest('[data-flt]'); if (flt) { ui.extraFilter = flt.dataset.flt; renderExtra(); return; }
  const df =t.closest('[data-delfind]'); if (df) { (S.finds[focusId()] || []).splice(+df.dataset.delfind, 1); save(); renderExtra(); renderHint(); return; }
  const ed = t.closest('[data-editdef]'); if (ed) { defModal(ed.dataset.editdef); return; }

  const cite = t.closest('[data-cite]'); if (cite) { copy(cite.dataset.cite); return; }

  const pb = t.closest('.pane [data-act]');
  if (pb) {
    const i = +pb.closest('.pane').dataset.idx, id = ui.panes[i];
    if (pb.dataset.act === 'bm') toggleBm(id);
    else if (pb.dataset.act === 'copy') copy(par(id) + ' ' + META.law.abbr);
    else if (pb.dataset.act === 'close') closePane(i);
    else if (pb.dataset.act === 'solo') soloPane(i);
    return;
  }
  const pane = t.closest('.pane'); if (pane && !t.closest('a')) setFocus(+pane.dataset.idx);

  const act = t.closest('[data-act]');
  if (act) {
    switch (act.dataset.act) {
      case 'clear-history': if (confirm('Verlauf wirklich leeren? (Lernstand-Daten bleiben erhalten)')) { S.history = []; save(); renderLeft(); } break;
      case 'toggle-gone': S.settings.showGone = !S.settings.showGone; save(); renderRight(); break;
      case 'add-tag': tagModal(); break;
      case 'add-find': findModal(act.dataset.kind); break;
      case 'to-top': $('#scroller').scrollTo({ top: 0 }); break;
      case 'demo': setEl.hidden = true; loadDemo(); break;
      case 'export': exportData(); break;
      case 'import': setEl.hidden = true; importData(); break;
      case 'reset': if (confirm('Alle lokalen Daten (Verlauf, Lesezeichen, Notizen, Definitionen) löschen?')) { try { localStorage.removeItem(STORE_KEY); } catch (err) { /* ignorieren */ } location.hash = ''; location.reload(); } break;
    }
    return;
  }
  if (t.closest('#hintbar')) { $('#scroller').scrollTo({ top: $('#stage').offsetHeight - 10 }); }
});
function copy(text) {
  const done = () => toast('Zitat kopiert: ' + text);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => toast('Kopieren nicht möglich'));
  else { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Kopieren nicht möglich'); } ta.remove(); }
}
function toggleBm(id) {
  const i = S.bookmarks.indexOf(id);
  if (i >= 0) S.bookmarks.splice(i, 1); else S.bookmarks.push(id);
  save(); renderPanes(); renderLeft(); renderRight();
}
$('#btnLeft').onclick = () => { S.settings.left = !S.settings.left; save(); renderTop(); };
$('#btnRight').onclick = () => { S.settings.right = !S.settings.right; save(); renderTop(); };

/* Auswahl → „Eigene Definition“ */
const selBtn = $('#selbtn'); let selText = '';
document.addEventListener('mouseup', e => {
  if (e.target === selBtn) return;
  setTimeout(() => {
    const sel = getSelection(); const txt = sel ? sel.toString().trim() : '';
    if (txt && txt.length >= 3 && txt.length <= 60 && !/\n/.test(txt) && sel.rangeCount && sel.anchorNode && sel.anchorNode.parentElement && sel.anchorNode.parentElement.closest('.pane-body')) {
      const r = sel.getRangeAt(0).getBoundingClientRect(); selText = txt;
      selBtn.hidden = false; selBtn.style.left = Math.min(r.left, innerWidth - 170) + 'px'; selBtn.style.top = (r.top - 38 < 8 ? r.bottom + 6 : r.top - 38) + 'px';
    } else selBtn.hidden = true;
  }, 10);
});
selBtn.addEventListener('mousedown', e => e.preventDefault());
selBtn.addEventListener('click', () => { selBtn.hidden = true; const key = 'c:' + selText.toLowerCase(); defModal(S.customDefs[key] ? key : null, selText); getSelection().removeAllRanges(); });
$('#scroller').addEventListener('scroll', () => { selBtn.hidden = true; hidePop(); }, { passive: true });

/* Tastatur */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); qEl.focus(); qEl.select(); return; }
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); qEl.focus(); return; }
  if (e.key === 'Escape') { if (!modalEl.hidden) closeModal(); else if (!setEl.hidden) setEl.hidden = true; else hidePop(); }
});

/* ================================================================ Verweildauer */
let dirty = 0;
setInterval(() => {
  const id = focusId();
  if (!id || role() !== 'student' || document.visibilityState !== 'visible' || !document.hasFocus()) return;   // Praxis: kein Lern-Tracking
  stat(id).secs++; if (++dirty >= 10) { dirty = 0; save(); if (ui.leftTab === 'learn') renderLeft(); }
}, 1000);

/* ================================================================ Start */
function parseHash() {
  const m = /^#\/stgb\/([0-9a-z,]+)/.exec(location.hash);
  return m ? m[1].split(',').filter((id, i, a) => LAW.norms[id] && a.indexOf(id) === i).slice(0, MAXPANES) : [];
}
window.addEventListener('hashchange', () => {
  const p = parseHash();
  if (p.length && p.join() !== ui.panes.join()) { ui.panes = p; ui.focus = Math.min(ui.focus, p.length - 1); afterNav(focusId()); }
});

// Einmalige Rollenwahl beim ersten Start (jederzeit oben rechts oder in den Einstellungen änderbar)
function roleChooser() {
  openModal('<h3>Wähle deine Ansicht.</h3><div class="sub">Sie passt Hilfen und Literatur an. Du kannst jederzeit oben rechts wechseln.</div>' +
    '<div class="role-cards">' +
      '<button class="role-card" data-role="student"><b>Studium</b><span>Kurz erklärt, Begriffe zum Hovern, Lernstand, Prüfungsrelevanz. Literatur: ZJS-Aufsätze, Übungs- und Examensfälle, Lehrbücher.</span></button>' +
      '<button class="role-card" data-role="pro"><b>Praxis</b><span>Ruhiger Text, Fußnoten offen, kein Lernstand. Literatur: Kommentare und Anmerkungen; Rechtsprechung, neueste zuerst.</span></button>' +
    '</div>');
  S.settings.roleChosen = true; save();   // nur einmal fragen
}

function init() {
  buildTerms();
  const fromHash = parseHash();
  let restored = false;
  if (fromHash.length) { ui.panes = fromHash; ui.focus = 0; }
  else if (S.last && S.last.panes && S.last.panes.filter(id => LAW.norms[id]).length) { ui.panes = S.last.panes.filter(id => LAW.norms[id]); ui.focus = Math.min(S.last.focus || 0, ui.panes.length - 1); restored = true; }
  else { ui.panes = ['211']; ui.focus = 0; }
  if (!restored) recordVisit(focusId());
  persistLast();
  renderPanes(); renderChrome();
  if (!S.settings.roleChosen) { roleChooser(); return; }
  if (restored && S.history.length > 1) {
    const h = S.history[0], n = LAW.norms[h.id];
    toast('Willkommen zurück. Zuletzt gelesen: ' + par(h.id) + ' ' + n.title + ' (' + ago(h.ts) + ')', { label: 'Hier weitermachen', fn: () => { $$('.pane-body')[ui.focus].scrollTo({ top: 0 }); } });
  }
}
init();
window.__normfenster = { LAW, S: () => S, go, loadDemo };   // für Debugging in der Konsole
})();

</script>
